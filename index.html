<body>

    <h1>Sistema de Gestión de Casilleros Universitarios</h1>

    <h2>Registro de Préstamo</h2>

    <form>
        <<form id="formCasillero">

    <p>
        <label>Número de Casillero:</label><br>
        <input type="text" id="casillero" required>
    </p>

    <p>
        <label>Nombre del Estudiante:</label><br>
        <input type="text" id="nombre" required>
    </p>

    <p>
        <label>Número de Documento:</label><br>
        <input type="text" id="documento" required>
    </p>

    <button type="submit">Guardar Registro</button>

</form>
